[package]
name = "v_utils_macros"
version = "2.16.2"
edition = "2021"
description = "Macros for my utils crate"
rust-version = "1.75"
license = "MIT"
readme = "README.md"
autotests = false
repository = "https://github.com/Valera6/v_utils"
include = ["src/lib.rs", "README.md", "build.rs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
proc-macro = true

[features]
default = ["cli"]
cli = []
xdg = []

full = ["cli", "xdg"]

[dependencies]
heck.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote.workspace = true
serde.workspace = true
syn = { workspace = true, features = ["full", "extra-traits"] }

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
insta.workspace = true
polars = { workspace = true, features = ["fmt"] } # pains me to add this entire dep for one test. Maybe I'll figure out a way to get rid of this at some point.
schemars.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing-error.workspace = true
ui_test.workspace = true
v_utils = { workspace = true, features = ["full"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "compile_fail"
path = "tests/compile_fail.rs"
harness = false
